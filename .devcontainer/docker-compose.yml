# Dev container stack: workspace app + Qdrant + Redis on one network.
# The app talks to Qdrant via the service name (QDRANT_URL below), so retrieval
# uses the real server (full BM25/IDF) rather than embedded local mode.
services:
  app:
    build:
      context: ..
      dockerfile: .devcontainer/Dockerfile
    volumes:
      - ..:/workspace:cached
      - fastembed_cache:/root/.cache   # persist downloaded ONNX models across rebuilds
    environment:
      - QDRANT_URL=http://qdrant:6333
    command: sleep infinity
    depends_on:
      - qdrant
      - redis

  qdrant:
    image: qdrant/qdrant:latest
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_storage:/qdrant/storage

  redis:
    image: redis:7-alpine
    volumes:
      - redis_storage:/data

volumes:
  qdrant_storage:
  redis_storage:
  fastembed_cache:
