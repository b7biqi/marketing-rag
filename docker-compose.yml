# Optional: run Qdrant (and Redis) as services instead of embedded local mode.
# Embedded local mode (default) needs no Docker. Use this for full BM25/IDF
# scoring and production-shaped deployment.
#
#   docker compose up -d
#   then set QDRANT_URL=http://localhost:6333 in .env
services:
  qdrant:
    image: qdrant/qdrant:latest
    ports:
      - "6333:6333"   # REST
      - "6334:6334"   # gRPC
    volumes:
      - qdrant_storage:/qdrant/storage

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_storage:/data

volumes:
  qdrant_storage:
  redis_storage:
